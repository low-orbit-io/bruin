name: Test Multiple Versions

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]

jobs:
  test_multiple_versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react:
          - 18.0.0
          - 18.1.0
          - 18.2.0
          - 18.3.1
          - 19.0.0
          - 19.1.0
          - 19.2.0-canary-0bdb9206-20250818
          - 0.0.0-experimental-0bdb9206-20250818
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install
      - name: Test ${{ matrix.react }}
        run: |
          pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
          pnpm run test:spec

  check:
    runs-on: ubuntu-latest
    needs: test_multiple_versions
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test_multiple_versions.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
