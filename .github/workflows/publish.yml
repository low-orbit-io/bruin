name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          # Strip 'v' prefix from tag (v1.2.3 -> 1.2.3)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:spec

      - name: Build
        run: pnpm run build

      - name: Update version in dist/package.json
        run: |
          cd dist
          # Update version from tag
          npm pkg set version="${{ steps.version.outputs.version }}"
          echo "Updated package.json:"
          cat package.json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: dist

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publish-dist-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30
